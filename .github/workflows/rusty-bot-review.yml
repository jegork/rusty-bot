name: Rusty Bot Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: rusty-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # build and run the PR's own code; calling the local action would run
      # the last published docker image instead (see action.yml)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # mirrors the Dockerfile; keep OPENGREP_VERSION in sync with it. a failed
      # download degrades to a review without sast
      - name: Install OpenGrep
        continue-on-error: true
        env:
          OPENGREP_VERSION: v1.19.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opengrep" --version
          pip3 install --target="$HOME/.cache/opengrep/${OPENGREP_VERSION}" \
            charset-normalizer==3.4.1 chardet==5.2.0

      - name: Run Rusty Bot
        run: node packages/github-action/dist/cli.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTY_MODE: github-action
          # the job timeout is 15 minutes and install + build use some of it;
          # the deadline makes the review post what it has instead of being cancelled
          RUSTY_REVIEW_DEADLINE_MS: "600000"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # same panel as the BuildFind downstream. the default model also
          # serves the title, description and structuring calls.
          RUSTY_LLM_MODEL: openrouter/anthropic/claude-haiku-5.5:low
          # positional with RUSTY_REVIEW_TEMPERATURES. seat 1 also runs the
          # skim tier; seat 3 joins when adaptive passes plans three.
          # openrouter drops temperature for haiku and luna.
          RUSTY_REVIEW_MODELS: >-
            openrouter/anthropic/claude-haiku-5.5:high,
            openrouter/openai/gpt-6-luna:xhigh,
            openrouter/z-ai/glm-5.3-flash
          RUSTY_REVIEW_TEMPERATURES: "0.2,0.3,0.2"
          RUSTY_REVIEW_ADAPTIVE_PASSES: "true"
          # the last allowed step is forced tool-free so a pass always ends with text
          RUSTY_LLM_MAX_STEPS: "20"
          RUSTY_JUDGE_ENABLED: "true"
          # the judge must be at least as strong as the strongest panelist, or it
          # silently drops true positives it cannot follow. on AA v4.3 glm-5.3-flash
          # scores 42, above haiku-5.5 at high (38) and gpt-6-luna at xhigh (34).
          RUSTY_JUDGE_MODEL: openrouter/z-ai/glm-5.3-flash
          RUSTY_JUDGE_TEMPERATURE: "0"
          RUSTY_LLM_TRIAGE_MODEL: openrouter/anthropic/claude-haiku-5.5:low
          RUSTY_TRIAGE_TEMPERATURE: "0"
          RUSTY_REVIEW_STYLE: balanced
          RUSTY_FAIL_ON_CRITICAL: "true"
          RUSTY_RENAME_TITLE_TO_CONVENTIONAL: true
          RUSTY_GENERATE_DESCRIPTION: true
          RUSTY_GRAPH_CONTEXT: "true"
          RUSTY_GRAPH_CONTEXT_TOKEN_BUDGET: "2000"
          RUSTY_GRAPH_CONTEXT_MAX_CANDIDATES: "8"
          # per-step finishReason / toolCallCount logging. Surfaces tool-loop
          # behavior (e.g. a pass that spends its whole step budget on
          # verification searches).
          RUSTY_LOG_AGENT_STEPS: "true"
          # consensus-quality experiment: dump per-pass raw findings BEFORE
          # clustering so we can tell whether models are producing different
          # findings (hard clustering job) vs. the same ones (easy job).
          # see CONSENSUS-QUALITY-WRITEUP.md.
          RUSTY_LOG_RAW_FINDINGS: "true"
          # written to the workspace so the next step can upload it.
          RUSTY_LOG_RAW_FINDINGS_FILE: ${{ github.workspace }}/rusty-raw-findings.ndjson
          LOG_LEVEL: debug

      - name: Upload raw findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-findings-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ github.workspace }}/rusty-raw-findings.ndjson
          if-no-files-found: ignore
          retention-days: 90
